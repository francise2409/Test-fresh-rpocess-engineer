<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc Nghiệm Kỹ Thuật</title>
<style>
:root {
  --navy:#0a1628; --navy2:#0d1f3c; --blue:#1a4a8a; --accent:#f0a500;
  --teal:#00838f; --red:#c0392b; --green:#1a6b3c; --orange:#d35400; --amber:#b45309;
  --text:#1a1a2e; --light:#f4f6fa; --border:#c8d4e8; --bg:#eef1f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Aptos','Segoe UI','Tahoma',sans-serif; font-size: 15px; line-height: 1.7;
  color: var(--text); background: var(--bg); min-height: 100vh;
  -webkit-user-select: none; user-select: none; }

.app-container { max-width: 880px; margin: 0 auto; padding: 0 16px 60px; }

/* HEADER */
.report-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 60%, #162840 100%);
  color: #fff; padding: 30px 32px 26px; margin: 0 -16px 0;
  border-bottom: 4px solid var(--accent); position: relative; overflow: hidden; }
.report-header::before { content: ''; position: absolute; right: -60px; top: -60px;
  width: 280px; height: 280px; border: 36px solid rgba(240,165,0,.08); border-radius: 50%; }
.header-row { display: flex; align-items: center; gap: 16px; position: relative; flex-wrap: wrap; }
.header-logo { width: 64px; height: auto; border-radius: 6px; background: #fff; padding: 4px; flex-shrink: 0; }
.header-text { flex: 1; min-width: 200px; }
.report-header h1 { font-size: 1.45rem; font-weight: 700; color: var(--accent); line-height: 1.3; }
.report-header .subtitle { font-size: .92rem; color: #a8c0e0; margin-top: 5px; font-style: italic; }
.report-header .meta { margin-top: 10px; font-size: .78rem; color: #7090b0; font-family: monospace; }

/* CARDS (shared) */
.panel { background: #fff; border-radius: 8px; padding: 28px; margin-top: 22px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08); border: 1px solid var(--border); }
.panel h2 { color: var(--navy); font-size: 1.15rem; margin-bottom: 6px; }
.panel .lead { color: #667; font-size: .88rem; color: #666; margin-bottom: 18px; }

/* SET SELECT SCREEN */
.set-list { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
.set-card { border: 1.5px solid var(--border); border-radius: 10px; padding: 16px 18px;
  cursor: pointer; transition: all .15s; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.set-card:hover { border-color: var(--blue); background: #f0f4fb; transform: translateY(-1px); }
.set-card .set-info h3 { color: var(--navy); font-size: 1.02rem; margin-bottom: 4px; }
.set-card .set-info .set-sub { font-size: .84rem; color: #667; margin-bottom: 6px; }
.set-card .set-info .set-desc { font-size: .8rem; color: #8a94a6; }
.set-card .set-arrow { font-size: 1.4rem; color: var(--blue); flex-shrink: 0; }
.lock-chip { display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .3px; background: #fff3e0; color: var(--orange); padding: 2px 8px; border-radius: 10px; margin-top: 6px; }

/* LOGIN / PASSGATE FORMS */
.panel label { display: block; font-weight: 600; margin-bottom: 4px; color: var(--blue); font-size: .9rem; }
.panel input, .panel select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 6px;
  font-size: .95rem; margin-bottom: 16px; font-family: inherit; background: #fff; }
.panel input:focus, .panel select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,74,138,.12); }
.field-row { display: flex; gap: 16px; flex-wrap: wrap; }
.field-row .field { flex: 1; min-width: 200px; }

.btn-primary { background: var(--navy); color: var(--accent); border: none; padding: 12px 32px;
  font-size: 1rem; font-weight: 700; border-radius: 6px; cursor: pointer; letter-spacing: .3px; transition: all .2s; }
.btn-primary:hover { background: var(--blue); transform: translateY(-1px); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-link { background: none; border: none; color: var(--blue); font-size: .85rem; font-weight: 600;
  cursor: pointer; padding: 6px 0; text-decoration: underline; }
.err-text { color: var(--red); font-size: .85rem; min-height: 18px; margin-top: -6px; margin-bottom: 8px; }

.bank-info { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; font-size: .82rem; color: #475569; }
.bank-info b { color: var(--navy); }

.rule-box { margin-top: 18px; padding: 14px 18px; background: #fffbf0; border-left: 4px solid var(--accent);
  border-radius: 0 6px 6px 0; font-size: .88rem; color: #555; line-height: 1.6; }

/* PROGRESS BAR */
.progress-wrap { background: #fff; border-radius: 8px; padding: 14px 22px; margin-top: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid var(--border); }
.progress-info { display: flex; justify-content: space-between; font-size: .84rem; color: #666; margin-bottom: 8px; }
.progress-info .exit-link { cursor: pointer; color: var(--blue); text-decoration: underline; }
.progress-bar { height: 8px; background: #e0e4ec; border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--accent));
  border-radius: 4px; transition: width .4s ease; }

/* QUESTION CARD */
.question-card { background: #fff; border-radius: 8px; padding: 26px 26px 22px; margin-top: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08); border: 1px solid var(--border); }
.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.q-number { font-size: .8rem; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .5px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: .68rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase;
  letter-spacing: .03em; white-space: nowrap; }
.badge.easy { background: #dcfce7; color: var(--green); }
.badge.medium { background: #fef3c7; color: var(--amber); }
.badge.hard { background: #fee2e2; color: var(--red); }
.badge.cat { background: #e0e7ff; color: #3730a3; font-size: .64rem; }
.q-text { font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }

.option-list { list-style: none; }
.option-item { border: 1.5px solid var(--border); border-radius: 8px; padding: 12px 16px;
  margin-bottom: 10px; cursor: pointer; transition: all .2s; display: flex; align-items: flex-start; gap: 12px; }
.option-item:hover { border-color: var(--blue); background: #f0f4fb; }
.option-item.selected { border-color: var(--blue); background: #e8f0fc; }
.option-item.correct { border-color: var(--green); background: #e8f8ee; }
.option-item.wrong { border-color: var(--red); background: #fdeaea; }
.option-item.disabled { pointer-events: none; }
.option-letter { display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%; background: var(--light); font-weight: 700;
  color: var(--blue); font-size: .85rem; flex-shrink: 0; border: 1.5px solid var(--border); }
.option-item.selected .option-letter { background: var(--blue); color: #fff; border-color: var(--blue); }
.option-item.correct .option-letter { background: var(--green); color: #fff; border-color: var(--green); }
.option-item.wrong .option-letter { background: var(--red); color: #fff; border-color: var(--red); }
.option-text { flex: 1; padding-top: 3px; }

/* EXPLANATION */
.explanation-box { margin-top: 16px; padding: 14px 18px; border-radius: 6px; font-size: .92rem;
  line-height: 1.6; border-left: 4px solid; }
.explanation-box.correct-exp { background: #f0fff4; border-color: var(--green); }
.explanation-box.wrong-exp { background: #fff8f0; border-color: var(--orange); }
.explanation-box .exp-label { font-weight: 700; font-size: .8rem; text-transform: uppercase;
  letter-spacing: .4px; margin-bottom: 4px; }
.explanation-box.correct-exp .exp-label { color: var(--green); }
.explanation-box.wrong-exp .exp-label { color: var(--orange); }
.exp-ref { font-size: .82rem; color: #888; font-style: italic; margin-top: 6px; }

/* NAV BUTTONS */
.nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 12px; }
.btn-nav { padding: 10px 24px; border-radius: 6px; font-size: .95rem; font-weight: 600;
  cursor: pointer; border: 1.5px solid var(--border); background: #fff; color: var(--text); transition: all .2s; }
.btn-nav:hover { border-color: var(--blue); color: var(--blue); }
.btn-nav.btn-next { background: var(--navy); color: var(--accent); border-color: var(--navy); }
.btn-nav.btn-next:hover { background: var(--blue); }
.btn-nav:disabled { opacity: .4; cursor: not-allowed; }

/* RESULT SCREEN */
.result-screen { background: #fff; border-radius: 8px; padding: 32px; margin-top: 22px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08); border: 1px solid var(--border); text-align: center; }
.score-circle { width: 150px; height: 150px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; border: 6px solid; }
.score-number { font-size: 2.5rem; font-weight: 800; line-height: 1; }
.score-label { font-size: .84rem; font-weight: 600; margin-top: 2px; }
.result-badge { display: inline-block; padding: 8px 24px; border-radius: 20px; font-weight: 700; font-size: 1rem;
  margin-bottom: 14px; color: #fff; }
.result-message { font-size: .95rem; color: #555; max-width: 520px; margin: 0 auto 20px; line-height: 1.7; }

.score-breakdown { display: flex; justify-content: center; gap: 20px; margin: 14px 0; flex-wrap: wrap; }
.score-breakdown div { font-size: .85rem; }
.score-breakdown b { display: block; font-size: 1.1rem; color: var(--navy); }

.cat-breakdown { margin-top: 14px; text-align: left; }
.cat-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: .82rem; }
.cat-bar-label { min-width: 160px; font-weight: 600; color: #374151; text-align: right; }
.cat-bar-bg { flex: 1; height: 14px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
.cat-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }
.cat-bar-pct { min-width: 70px; font-weight: 700; font-size: .82rem; }

/* REVIEW TABLE */
.review-section { text-align: left; margin-top: 26px; }
.review-section h3 { color: var(--navy); font-size: 1.05rem; margin-bottom: 12px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th { background: var(--blue); color: #fff; padding: 8px 10px; text-align: left; }
td { border: 1px solid var(--border); padding: 7px 10px; vertical-align: top; }
tr:nth-child(even) td { background: #f7f9fd; }
td.cell-correct { color: var(--green); font-weight: 600; }
td.cell-wrong { color: var(--red); font-weight: 600; }

.actions-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
.btn-print { background: var(--teal); color: #fff; border: none; padding: 10px 22px;
  font-size: .92rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
.btn-print:hover { opacity: .9; }
.btn-retry { background: var(--orange); color: #fff; border: none; padding: 10px 22px;
  font-size: .92rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
.btn-retry:hover { opacity: .9; }
.btn-outline { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); padding: 10px 22px;
  font-size: .92rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
.btn-outline:hover { background: #f0f4fb; }

.load-err { text-align: center; color: var(--red); padding: 40px; font-weight: 600; }

@media print {
  body { background: #fff; -webkit-user-select: auto; user-select: auto; }
  .btn-print, .btn-retry, .btn-outline, .nav-buttons, .progress-wrap { display: none !important; }
  .app-container { max-width: 100%; }
  .result-screen { break-inside: avoid; }
}
@media(max-width:600px) {
  .report-header { padding: 22px 18px 18px; }
  .report-header h1 { font-size: 1.2rem; }
  .header-logo { width: 48px; }
  .panel, .question-card, .result-screen { padding: 18px 16px; }
  .cat-bar-label { min-width: 100px; font-size: .74rem; }
}
</style>
</head>
<body>

<div class="app-container">
  <div class="report-header">
    <div class="header-row">
      <img src="logo.jpg" alt="Logo" class="header-logo">
      <div class="header-text">
        <h1 id="headerTitle">Trắc Nghiệm Kỹ Thuật</h1>
        <div class="subtitle" id="headerSubtitle">Chọn bộ đề để bắt đầu ôn tập / kiểm tra</div>
        <div class="meta" id="headerMeta">Process Engineering Training</div>
      </div>
    </div>
  </div>

  <div id="app"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// QUIZ SET CONFIG — thêm bộ đề mới bằng cách thêm 1 object
// vào mảng này và đặt file JSON tương ứng cùng thư mục với
// index.html (ví dụ trên GitHub Pages). Không cần sửa gì khác.
// ─────────────────────────────────────────────────────────
const QUIZ_SETS = [
  {
    key: 'process_safety',
    label: 'Process Safety Quiz',
    subtitle: 'PSV Sizing & Selection • Flare & Relief Systems • Process Safety Analysis',
    description: '160 câu hỏi • 8 tiêu chuẩn • API 520/521/2000/537/14C/14J & Total GS EP SAF 216',
    jsonFile: 'process_safety_quiz_v2.json',
    format: 'documents',
    password: 'process2026'
  },
  {
    key: 'isolation_philosophy',
    label: 'Isolation Philosophy Quiz',
    subtitle: 'Based on Shell DEP 31.38.01.25-Gen. — Piping Process Design Requirements',
    description: '20 câu hỏi • Triết lý cách ly công nghệ đường ống',
    jsonFile: 'isolation_philosophy_quiz.json',
    format: 'flat',
    password: null
  }
];

const DEFAULT_SCORING = [
  { min: 0,  label: 'Cần ôn tập lại',              color: '#c0392b', message: 'Bạn cần ôn tập lại kiến thức trước khi kiểm tra lại.' },
  { min: 60, label: 'Khá tốt — cần cải thiện thêm', color: '#d35400', message: 'Bạn đã nắm được một số khái niệm cơ bản, nhưng cần ôn tập thêm các phần chi tiết.' },
  { min: 80, label: 'Thành thạo — PASS',            color: '#1a6b3c', message: 'Bạn đã nắm vững kiến thức. Sẵn sàng áp dụng vào công việc thực tế.' }
];

// Thay URL bên dưới bằng URL Web App sau khi deploy Google Apps Script.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby41Guf3ikbqlfIN1fFkhh-ChyOiMZ1_-7RDcFXLtb4G-jhakri650YxldHEeO1a0IYoA/exec";

// ─────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────
const state = {
  screen: 'selectSet', // selectSet | passGate | login | quiz | result
  setConfig: null,
  bank: [],
  hasDifficulty: false,
  scoring: DEFAULT_SCORING,
  loadError: '',
  name: '',
  userId: '',
  mode: 'mix10',
  currentSet: [],
  currentQ: 0,
  answers: {},
  submitted: {}
};

// ─────────────────────────────────────────────────────────
// UTIL
// ─────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function diffClass(d){ if(d==='Easy') return 'easy'; if(d==='Medium') return 'medium'; return 'hard'; }
function diffLabel(d){ if(d==='Easy') return 'Dễ'; if(d==='Medium') return 'TB'; return 'Khó'; }
function gradeFor(pct, thresholds){
  let g = thresholds[0];
  thresholds.forEach(t => { if (pct >= t.min) g = t; });
  return g;
}

// ─────────────────────────────────────────────────────────
// NORMALIZATION — chuyển các định dạng JSON khác nhau về
// cùng 1 cấu trúc câu hỏi nội bộ.
// ─────────────────────────────────────────────────────────
function normalizeDocumentsFormat(data){
  const bank = [];
  (data.documents || []).forEach(doc => {
    const cat = doc.document_name || doc.document_title || 'Khác';
    (doc.questions || []).forEach(q => {
      const opts = (q.options || []).map(optStr => {
        const m = String(optStr).match(/^([A-D])\.\s*([\s\S]*)$/);
        return m ? { letter: m[1], text: m[2] } : { letter: '', text: optStr };
      });
      bank.push({
        id: q.id, difficulty: q.difficulty || null, category: cat,
        question: q.question, options: opts, correctLetter: q.answer,
        explanation: q.explanation || '', reference: ''
      });
    });
  });
  return bank;
}

function normalizeFlatFormat(data){
  const bank = [];
  const cat = (data.quiz_meta && data.quiz_meta.title) || 'Chung';
  (data.questions || []).forEach(q => {
    const letters = Object.keys(q.options || {});
    const opts = letters.map(l => ({ letter: l, text: q.options[l] }));
    bank.push({
      id: q.id, difficulty: null, category: cat,
      question: q.question, options: opts, correctLetter: q.correct,
      explanation: q.explanation || '', reference: q.reference || ''
    });
  });
  return bank;
}

function getScoringThresholds(data, setConfig){
  if (data.quiz_meta && data.quiz_meta.scoring) {
    const s = data.quiz_meta.scoring;
    const list = [];
    if (s.below_50) list.push({ min: 0, ...s.below_50 });
    if (s['50_to_79']) list.push({ min: data.quiz_meta.review_threshold || 50, ...s['50_to_79'] });
    if (s['80_to_100']) list.push({ min: data.quiz_meta.passing_score || 80, ...s['80_to_100'] });
    if (list.length) return list.sort((a, b) => a.min - b.min);
  }
  return (setConfig && setConfig.defaultScoring) || DEFAULT_SCORING;
}

// ─────────────────────────────────────────────────────────
// LOADING
// ─────────────────────────────────────────────────────────
async function loadSetData(setConfig){
  const resp = await fetch(setConfig.jsonFile);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const raw = await resp.text();
  const clean = raw.charCodeAt(0) === 0xFEFF ? raw.slice(1) : raw;
  const data = JSON.parse(clean);

  const bank = setConfig.format === 'flat'
    ? normalizeFlatFormat(data)
    : normalizeDocumentsFormat(data);

  if (bank.length === 0) throw new Error('No questions found');

  state.bank = bank;
  state.hasDifficulty = bank.some(q => q.difficulty);
  state.scoring = getScoringThresholds(data, setConfig);
}

// ─────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────
const app = document.getElementById('app');

function setHeader(title, subtitle, meta){
  document.getElementById('headerTitle').textContent = title;
  document.getElementById('headerSubtitle').textContent = subtitle;
  document.getElementById('headerMeta').textContent = meta;
}

function render(){
  if (state.screen === 'selectSet') renderSelectSet();
  else if (state.screen === 'passGate') renderPassGate();
  else if (state.screen === 'login') renderLogin();
  else if (state.screen === 'quiz') renderQuiz();
  else if (state.screen === 'result') renderResult();
}

function renderSelectSet(){
  setHeader('Trắc Nghiệm Kỹ Thuật', 'Chọn bộ đề để bắt đầu ôn tập / kiểm tra', 'Process Engineering Training');

  let cards = '';
  QUIZ_SETS.forEach((s, i) => {
    cards += `
      <div class="set-card" onclick="chooseSet(${i})">
        <div class="set-info">
          <h3>${s.label}</h3>
          <div class="set-sub">${s.subtitle}</div>
          <div class="set-desc">${s.description}</div>
          ${s.password ? '<span class="lock-chip">🔒 Cần mật khẩu</span>' : ''}
        </div>
        <div class="set-arrow">→</div>
      </div>`;
  });

  app.innerHTML = `
    <div class="panel">
      <h2>Danh sách bộ đề</h2>
      <div class="lead">Chọn một bộ đề bên dưới. Quản trị viên có thể cập nhật câu hỏi bằng cách thay file JSON tương ứng trên GitHub.</div>
      <div class="set-list">${cards}</div>
      ${state.loadError ? `<div class="err-text" style="margin-top:14px">${state.loadError}</div>` : ''}
    </div>`;
}

async function chooseSet(i){
  const setConfig = QUIZ_SETS[i];
  state.setConfig = setConfig;
  state.loadError = '';
  app.innerHTML = `<div class="panel"><h2>Đang tải bộ đề...</h2><div class="lead">${setConfig.label}</div></div>`;
  try {
    await loadSetData(setConfig);
    state.screen = setConfig.password ? 'passGate' : 'login';
    render();
  } catch (err) {
    console.error('Load error:', err);
    state.screen = 'selectSet';
    state.loadError = 'Không thể tải file câu hỏi (' + setConfig.jsonFile + '). Kiểm tra file đã được đặt cùng thư mục với index.html.';
    render();
  }
}

function renderPassGate(){
  const s = state.setConfig;
  setHeader(s.label, s.subtitle, s.description);
  app.innerHTML = `
    <div class="panel" style="max-width:420px;margin:22px auto 0;text-align:center;">
      <div style="font-size:2.2rem;margin-bottom:10px;">🔒</div>
      <h2>Nhập mật khẩu để vào thi</h2>
      <div class="lead">Bộ đề "${s.label}" yêu cầu mật khẩu — liên hệ Team Lead để nhận mật khẩu.</div>
      <input type="password" id="gatePassword" placeholder="Nhập mật khẩu..." autofocus>
      <div class="err-text" id="gateError"></div>
      <button class="btn-primary" onclick="tryUnlock()">Mở khóa</button>
      <div style="margin-top:14px"><button class="btn-link" onclick="backToSelectSet()">‹ Chọn bộ đề khác</button></div>
    </div>`;
  document.getElementById('gatePassword').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
}

function tryUnlock(){
  const val = document.getElementById('gatePassword').value;
  const errEl = document.getElementById('gateError');
  if (!val) { errEl.textContent = 'Vui lòng nhập mật khẩu.'; return; }
  if (val === state.setConfig.password) {
    state.screen = 'login';
    render();
  } else {
    errEl.textContent = 'Mật khẩu không đúng. Vui lòng thử lại.';
    document.getElementById('gatePassword').value = '';
  }
}

function backToSelectSet(){
  state.screen = 'selectSet';
  state.setConfig = null;
  state.bank = [];
  render();
}

function renderLogin(){
  const s = state.setConfig;
  setHeader(s.label, s.subtitle, s.description);

  let bankInfoHtml = '';
  let modeSelectHtml = '';
  if (state.hasDifficulty) {
    const easy = state.bank.filter(q => q.difficulty === 'Easy').length;
    const med = state.bank.filter(q => q.difficulty === 'Medium').length;
    const hard = state.bank.filter(q => q.difficulty === 'Hard').length;
    const cats = [...new Set(state.bank.map(q => q.category))];
    bankInfoHtml = `<div class="bank-info">
        <span><b>Ngân hàng:</b> ${state.bank.length} câu</span>
        <span><b>Easy:</b> ${easy}</span>
        <span><b>Medium:</b> ${med}</span>
        <span><b>Hard:</b> ${hard}</span>
        <span><b>Tiêu chuẩn:</b> ${cats.length} bộ</span>
      </div>`;
    modeSelectHtml = `
      <label for="modeSelect">Chọn chế độ thi</label>
      <select id="modeSelect">
        <option value="mix10">10 câu ngẫu nhiên (mix Easy/Medium/Hard)</option>
        <option value="easy10">10 câu Easy</option>
        <option value="medium10">10 câu Medium</option>
        <option value="hard10">10 câu Hard</option>
        <option value="mix20">20 câu ngẫu nhiên</option>
        <option value="all">Toàn bộ ${state.bank.length} câu</option>
      </select>`;
  } else {
    bankInfoHtml = `<div class="bank-info"><span><b>Ngân hàng:</b> ${state.bank.length} câu</span></div>`;
    modeSelectHtml = `<div class="lead" style="margin-top:-6px">Bài thi gồm toàn bộ ${state.bank.length} câu, thứ tự câu hỏi và đáp án được xáo trộn ngẫu nhiên.</div>`;
  }

  app.innerHTML = `
    <div class="panel">
      <h2>Thông tin người kiểm tra</h2>
      ${bankInfoHtml}
      <div class="field-row">
        <div class="field">
          <label for="userName">Họ và tên</label>
          <input type="text" id="userName" placeholder="Nhập họ và tên..." value="${state.name}" autofocus>
        </div>
        <div class="field">
          <label for="userId">Mã NV / Chức vụ</label>
          <input type="text" id="userId" placeholder="EMP-001 / Process Engineer" value="${state.userId}">
        </div>
      </div>
      ${modeSelectHtml}
      <div style="margin-top:8px">
        <button class="btn-primary" onclick="startQuizFlow()">Bắt đầu làm bài</button>
      </div>
      <div style="margin-top:14px"><button class="btn-link" onclick="backToSelectSet()">‹ Chọn bộ đề khác</button></div>
      <div class="rule-box">
        <strong style="color:#d35400;">Quy định chấm điểm:</strong><br>
        ${state.scoring.map(t => `• Từ ${t.min}%: <span style="color:${t.color};font-weight:600;">${t.label}</span>`).join('<br>')}
      </div>
    </div>`;
}

function startQuizFlow(){
  const name = document.getElementById('userName').value.trim();
  const userId = document.getElementById('userId').value.trim();
  if (!name) { document.getElementById('userName').style.borderColor = '#c0392b'; return; }
  state.name = name;
  state.userId = userId;
  state.mode = state.hasDifficulty ? document.getElementById('modeSelect').value : 'all';
  pickNewSet();
}

function pickNewSet(){
  let pool;
  if (!state.hasDifficulty || state.mode === 'all') {
    pool = shuffle(state.bank);
  } else if (state.mode === 'easy10') {
    pool = shuffle(state.bank.filter(q => q.difficulty === 'Easy')).slice(0, 10);
  } else if (state.mode === 'medium10') {
    pool = shuffle(state.bank.filter(q => q.difficulty === 'Medium')).slice(0, 10);
  } else if (state.mode === 'hard10') {
    pool = shuffle(state.bank.filter(q => q.difficulty === 'Hard')).slice(0, 10);
  } else if (state.mode === 'mix20') {
    pool = shuffle(state.bank).slice(0, 20);
  } else {
    const e = shuffle(state.bank.filter(q => q.difficulty === 'Easy')).slice(0, 3);
    const m = shuffle(state.bank.filter(q => q.difficulty === 'Medium')).slice(0, 4);
    const h = shuffle(state.bank.filter(q => q.difficulty === 'Hard')).slice(0, 3);
    pool = shuffle([...e, ...m, ...h]);
    if (pool.length === 0) pool = shuffle(state.bank).slice(0, 10);
  }

  state.currentSet = pool.map(q => {
    const optionsMap = {};
    q.options.forEach(o => { optionsMap[o.letter] = o.text; });
    return { ...q, optionsMap, optionOrder: shuffle(q.options.map(o => o.letter)) };
  });
  state.currentQ = 0;
  state.answers = {};
  state.submitted = {};
  state.screen = 'quiz';
  render();
  window.scrollTo(0, 0);
}

function renderQuiz(){
  const total = state.currentSet.length;
  const i = state.currentQ;
  const q = state.currentSet[i];
  const answered = state.answers[i] !== undefined;
  const submitted = state.submitted[i] === true;
  const pct = Math.round(((i + (submitted ? 1 : 0)) / total) * 100);

  let optionsHTML = '';
  q.optionOrder.forEach(letter => {
    let cls = 'option-item';
    if (submitted) {
      cls += ' disabled';
      if (letter === q.correctLetter) cls += ' correct';
      else if (letter === state.answers[i] && letter !== q.correctLetter) cls += ' wrong';
    } else if (state.answers[i] === letter) {
      cls += ' selected';
    }
    optionsHTML += `
      <li class="${cls}" onclick="selectOption(${i},'${letter}')">
        <span class="option-letter">${letter}</span>
        <span class="option-text">${q.optionsMap[letter]}</span>
      </li>`;
  });

  let explanationHTML = '';
  if (submitted) {
    const isCorrect = state.answers[i] === q.correctLetter;
    const cls = isCorrect ? 'correct-exp' : 'wrong-exp';
    const label = isCorrect ? '✓ Đúng rồi!' : `✗ Sai — đáp án đúng: ${q.correctLetter}`;
    explanationHTML = `
      <div class="explanation-box ${cls}">
        <div class="exp-label">${label}</div>
        ${q.explanation}
        ${q.reference ? `<div class="exp-ref">Ref: ${q.reference}</div>` : ''}
      </div>`;
  }

  const badges = `<div class="badges">
      ${q.difficulty ? `<span class="badge ${diffClass(q.difficulty)}">${diffLabel(q.difficulty)}</span>` : ''}
      <span class="badge cat">${q.category}</span>
    </div>`;

  const isLast = i === total - 1;

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-info">
        <span>${state.name}</span>
        <span>Câu ${i + 1} / ${total}</span>
        <span class="exit-link" onclick="exitQuiz()">‹ Thoát bài thi</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-card">
      <div class="q-head"><span class="q-number">Câu hỏi ${i + 1}</span>${badges}</div>
      <div class="q-text">${q.question}</div>
      <ul class="option-list">${optionsHTML}</ul>
      ${explanationHTML}
    </div>
    <div class="nav-buttons">
      <button class="btn-nav" onclick="prevQ()" ${i === 0 ? 'disabled' : ''}>← Trước</button>
      <div>
        ${!submitted && answered ? `<button class="btn-nav btn-next" onclick="submitAnswer(${i})">Xác nhận</button>` : ''}
        ${submitted && !isLast ? `<button class="btn-nav btn-next" onclick="nextQ()">Tiếp →</button>` : ''}
        ${submitted && isLast ? `<button class="btn-nav btn-next" onclick="showResult()">Xem kết quả</button>` : ''}
      </div>
    </div>`;
}

function selectOption(qIndex, letter){
  if (state.submitted[qIndex]) return;
  state.answers[qIndex] = letter;
  render();
}
function submitAnswer(qIndex){ state.submitted[qIndex] = true; render(); }
function nextQ(){ if (state.currentQ < state.currentSet.length - 1) { state.currentQ++; render(); window.scrollTo(0, 0); } }
function prevQ(){ if (state.currentQ > 0) { state.currentQ--; render(); window.scrollTo(0, 0); } }
function exitQuiz(){ if (confirm('Thoát bài thi hiện tại? Kết quả đang làm dở sẽ không được lưu.')) { state.screen = 'login'; render(); } }
function showResult(){ state.screen = 'result'; render(); window.scrollTo(0, 0); }

function getScore(){
  let correct = 0;
  state.currentSet.forEach((q, i) => { if (state.answers[i] === q.correctLetter) correct++; });
  return correct;
}
function getPercent(){ return Math.round((getScore() / state.currentSet.length) * 100); }

function renderResult(){
  const total = state.currentSet.length;
  const score = getScore();
  const pct = getPercent();
  const grade = gradeFor(pct, state.scoring);

  let byDiff = { Easy: { c: 0, t: 0 }, Medium: { c: 0, t: 0 }, Hard: { c: 0, t: 0 } };
  let byCat = {};
  let reviewRows = '';

  state.currentSet.forEach((q, i) => {
    const userAns = state.answers[i] || '—';
    const isCorrect = userAns === q.correctLetter;
    const cellCls = isCorrect ? 'cell-correct' : 'cell-wrong';
    const icon = isCorrect ? '✓' : '✗';

    if (q.difficulty) {
      byDiff[q.difficulty].t++;
      if (isCorrect) byDiff[q.difficulty].c++;
    }
    if (!byCat[q.category]) byCat[q.category] = { c: 0, t: 0 };
    byCat[q.category].t++;
    if (isCorrect) byCat[q.category].c++;

    reviewRows += `
      <tr>
        <td style="text-align:center">${i + 1}</td>
        <td>${q.question}</td>
        <td style="text-align:center">${q.category}</td>
        <td class="${cellCls}" style="text-align:center">${userAns}</td>
        <td style="text-align:center">${q.correctLetter}</td>
        <td class="${cellCls}" style="text-align:center">${icon}</td>
      </tr>`;
  });

  let bdHtml = '';
  ['Easy', 'Medium', 'Hard'].forEach(d => {
    if (byDiff[d].t > 0) bdHtml += `<div><b>${byDiff[d].c}/${byDiff[d].t}</b>${diffLabel(d)}</div>`;
  });

  let catHtml = '';
  Object.keys(byCat).sort().forEach(cat => {
    const c = byCat[cat];
    const p = Math.round((c.c / c.t) * 100);
    const color = p >= 70 ? 'var(--green)' : p >= 45 ? 'var(--amber)' : 'var(--red)';
    catHtml += `<div class="cat-bar-row">
        <span class="cat-bar-label">${cat}</span>
        <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${p}%;background:${color}"></div></div>
        <span class="cat-bar-pct" style="color:${color}">${c.c}/${c.t} (${p}%)</span>
      </div>`;
  });

  app.innerHTML = `
    <div class="result-screen">
      <div style="font-size:.85rem;color:#888;margin-bottom:4px;">${state.name}${state.userId ? ' — ' + state.userId : ''} • ${state.setConfig.label}</div>
      <div class="score-circle" style="border-color:${grade.color}">
        <div class="score-number" style="color:${grade.color}">${pct}%</div>
        <div class="score-label" style="color:${grade.color}">${score}/${total}</div>
      </div>
      <div class="result-badge" style="background:${grade.color}">${grade.label}</div>
      <div class="result-message">${grade.message}</div>
      ${bdHtml ? `<div class="score-breakdown">${bdHtml}</div>` : ''}
      ${catHtml ? `<div class="cat-breakdown">${catHtml}</div>` : ''}

      <div class="actions-row" style="margin-top:20px">
        <button class="btn-print" onclick="window.print()">📄 In / Xuất PDF</button>
        <button class="btn-retry" onclick="pickNewSet()">🔄 Làm lại bộ này</button>
        <button class="btn-outline" onclick="state.screen='login';render();">⚙️ Đổi chế độ thi</button>
        <button class="btn-outline" onclick="backToSelectSet()">🎲 Đổi bộ đề</button>
      </div>

      <div class="review-section">
        <h3>Chi tiết kết quả</h3>
        <div class="table-scroll">
          <table>
            <tr>
              <th style="width:40px">Câu</th>
              <th>Nội dung</th>
              <th style="width:120px">Tiêu chuẩn</th>
              <th style="width:60px">Trả lời</th>
              <th style="width:60px">Đáp án</th>
              <th style="width:40px">KQ</th>
            </tr>
            ${reviewRows}
          </table>
        </div>
      </div>
    </div>`;

  sendResult(score, total);
  window.scrollTo(0, 0);
}

function sendResult(score, total){
  const payload = {
    name: state.name,
    userId: state.userId,
    quizSet: state.setConfig.key,
    quizSetLabel: state.setConfig.label,
    score: score,
    total: total,
    percent: Math.round(score / total * 100),
    mode: state.mode,
    timestamp: new Date().toISOString()
  };
  fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(() => {});
}

// Anti-copy
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = e.key;
  const blocked = (k === 'F12') ||
    (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j' || k === 'C' || k === 'c')) ||
    (e.ctrlKey && (k === 'U' || k === 'u'));
  if (blocked) e.preventDefault();
});

// INIT
render();
</script>
</body>
</html>
