<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Safety Quiz – PSV, Flare, Relief & Safety Systems</title>
<style>
  :root{
    --navy:#1a3a5c; --blue:#2563eb; --green:#15803d; --red:#b91c1c; --amber:#b45309;
    --teal:#0d9488; --bg:#f4f6f9; --card:#ffffff; --border:#d8dee6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Aptos","Tahoma","Arial",sans-serif;background:var(--bg);color:#1f2937;line-height:1.55;
    -webkit-user-select:none;user-select:none;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 80px;}

  /* Header with logo */
  header.top{background:linear-gradient(135deg,#0c2d48,#1a3a5c);color:#fff;padding:24px;border-radius:10px;margin-bottom:20px;position:relative;overflow:hidden;}
  header.top::after{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.04);border-radius:50%;}
  .header-row{display:flex;align-items:center;gap:16px;position:relative;flex-wrap:wrap;}
  .header-logo{width:80px;height:auto;border-radius:6px;background:#fff;padding:4px;flex-shrink:0;}
  .header-text h1{font-size:1.35rem;margin-bottom:4px;}
  .header-text p{opacity:.85;font-size:.86rem;}
  .header-text small{opacity:.7;font-size:.78rem;}

  /* Password gate */
  #passGate{max-width:420px;margin:80px auto;text-align:center;}
  #passGate .lock-icon{font-size:2.8rem;margin-bottom:12px;}
  #passGate h2{color:var(--navy);margin-bottom:6px;font-size:1.2rem;}
  #passGate p{color:#6b7280;font-size:.88rem;margin-bottom:18px;}
  #passGate input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:1rem;margin-bottom:10px;}
  #passGate .gate-btn{width:100%;background:var(--navy);color:#fff;padding:11px;border:none;border-radius:8px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;transition:.15s;}
  #passGate .gate-btn:hover{background:#0f2440;}
  #passGate .gate-err{color:var(--red);font-size:.85rem;min-height:20px;margin-top:4px;}

  /* Quiz content */
  #quizContent{display:none;}
  .meta-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
  .meta-box .row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
  .meta-box label{font-size:.85rem;font-weight:600;color:#374151;display:block;margin-bottom:4px;}
  .meta-box input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.95rem;}
  .meta-box .field{flex:1;min-width:200px;}
  .bank-info{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:#475569;}
  .bank-info b{color:var(--navy);}

  .progress-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:var(--blue);width:0%;transition:width .25s;}

  .qcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:16px;}
  .qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .qnum{font-weight:700;color:var(--navy);font-size:1.02rem;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;}
  .badge{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .badge.easy{background:#dcfce7;color:var(--green);}
  .badge.medium{background:#fef3c7;color:var(--amber);}
  .badge.hard{background:#fee2e2;color:var(--red);}
  .badge.cat{background:#e0e7ff;color:#3730a3;font-size:.65rem;}
  .qtext{font-size:1rem;margin-bottom:14px;color:#111827;}

  .options label{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;transition:.15s;}
  .options label:hover{background:#f1f5f9;border-color:var(--blue);}
  .options input{margin-top:3px;flex-shrink:0;}
  .options .opt-letter{font-weight:700;color:var(--navy);min-width:16px;}
  .options label.selected{background:#e8f0fe;border-color:var(--blue);}
  .options label.correct-answer{background:#dcfce7;border-color:var(--green);}
  .options label.wrong-answer{background:#fee2e2;border-color:var(--red);}
  .result-tag{font-weight:700;font-size:.85rem;margin-left:8px;}
  .result-tag.ok{color:var(--green);}
  .result-tag.no{color:var(--red);}
  .explain{margin-top:10px;padding:10px 12px;background:#f8fafc;border-left:3px solid var(--blue);font-size:.9rem;color:#334155;border-radius:0 6px 6px 0;display:none;}

  .actions{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:.95rem;font-weight:700;padding:12px 22px;border:none;border-radius:8px;cursor:pointer;transition:.15s;}
  #submitBtn{background:var(--blue);color:#fff;}
  #submitBtn:hover{background:#1d4ed8;}
  #pdfBtn{background:var(--navy);color:#fff;display:none;}
  #pdfBtn:hover{background:#0f2440;}
  #retryBtn{background:#fff;color:var(--navy);border:1px solid var(--navy);display:none;}
  #newSetBtn{background:#fff;color:var(--green);border:1px solid var(--green);display:none;}

  .score-summary{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center;margin-bottom:20px;display:none;}
  .score-summary .big-score{font-size:2.4rem;font-weight:800;color:var(--navy);}
  .score-summary .sub{color:#6b7280;font-size:.92rem;margin-top:4px;}
  .score-breakdown{display:flex;justify-content:center;gap:20px;margin-top:14px;flex-wrap:wrap;}
  .score-breakdown div{font-size:.85rem;}
  .score-breakdown b{display:block;font-size:1.15rem;}

  /* Category breakdown bars */
  .cat-breakdown{margin-top:16px;text-align:left;}
  .cat-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.82rem;}
  .cat-bar-label{min-width:140px;font-weight:600;color:#374151;text-align:right;}
  .cat-bar-bg{flex:1;height:14px;background:#e5e7eb;border-radius:4px;overflow:hidden;position:relative;}
  .cat-bar-fill{height:100%;border-radius:4px;transition:width .4s;}
  .cat-bar-pct{min-width:60px;font-weight:700;font-size:.82rem;}

  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .filter-bar label{font-size:.85rem;font-weight:600;color:#374151;}
  .filter-bar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:.88rem;background:#fff;}

  .load-err{text-align:center;color:var(--red);padding:40px;font-weight:600;}

  @media print{
    body{background:#fff;-webkit-user-select:auto;user-select:auto;}
    header.top{background:#fff !important;color:#000 !important;border:1px solid #000;}
    header.top::after{display:none;}
    .header-logo{filter:none;}
    .actions,.progress-bar,.meta-box .row,.filter-bar,#newSetBtn{display:none !important;}
    .qcard{break-inside:avoid;border:1px solid #999;}
    .explain{display:block !important;}
    .badge.easy{background:none;border:1px solid var(--green);}
    .badge.medium{background:none;border:1px solid var(--amber);}
    .badge.hard{background:none;border:1px solid var(--red);}
    .badge.cat{background:none;border:1px solid #3730a3;}
    .options label.correct-answer{background:#e8f5e9 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .options label.wrong-answer{background:#fdecea !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .score-summary{border:1px solid #333;}
  }
  @media(max-width:600px){
    .wrap{padding:14px 10px 60px;}
    header.top{padding:18px 14px;}
    header.top h1{font-size:1.15rem;}
    .header-logo{width:56px;}
    .qcard{padding:14px 12px;}
    .options label{padding:8px 10px;}
    .score-breakdown{gap:12px;}
    .filter-bar{gap:6px;}
    .filter-bar select{font-size:.82rem;}
    .cat-bar-label{min-width:90px;font-size:.72rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="header-row">
      <img src="logo.jpg" alt="PTSC Offshore Services" class="header-logo">
      <div class="header-text">
        <h1>&#x1F6E1;&#xFE0F; Process Safety Quiz</h1>
        <p>PSV Sizing &amp; Selection &bull; Flare &amp; Relief Systems &bull; Process Safety Analysis</p>
        <small>160 câu hỏi &bull; 8 tiêu chuẩn &bull; API 520/521/2000/537/14C/14J &amp; Total GS EP SAF 216</small>
      </div>
    </div>
  </header>

  <!-- Password gate -->
  <div id="passGate">
    <div class="lock-icon">&#x1F512;</div>
    <h2>Nhập mật khẩu để vào thi</h2>
    <p>Bộ đề dành cho Process Safety Engineer &mdash; liên hệ Team Lead để nhận mật khẩu.</p>
    <input type="password" id="gatePassword" placeholder="Nhập mật khẩu...">
    <button class="gate-btn" id="gateSubmit">Mở khóa</button>
    <div class="gate-err" id="gateError"></div>
  </div>

  <!-- Quiz content -->
  <div id="quizContent">
    <div class="meta-box">
      <div class="row">
        <div class="field"><label>Họ & Tên</label><input type="text" id="userName" placeholder="Nguyễn Văn A"></div>
        <div class="field"><label>Mã NV / Chức vụ</label><input type="text" id="userId" placeholder="EMP-001 / Process Engineer"></div>
      </div>
      <div class="bank-info" id="bankInfo"></div>
    </div>

    <div class="filter-bar">
      <label>Chọn chế độ thi:</label>
      <select id="modeSelect">
        <option value="mix10">10 câu ngẫu nhiên (mix Easy/Medium/Hard)</option>
        <option value="easy10">10 câu Easy</option>
        <option value="medium10">10 câu Medium</option>
        <option value="hard10">10 câu Hard</option>
        <option value="mix20">20 câu ngẫu nhiên</option>
        <option value="all">Toàn bộ 160 câu</option>
      </select>
      <button id="newSetBtn2" style="background:var(--teal);color:#fff;padding:8px 16px;font-size:.88rem;">&#x1F504; Bộ đề mới</button>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="score-summary" id="scoreSummary">
      <div class="big-score" id="bigScore"></div>
      <div class="sub" id="scoreSub"></div>
      <div class="score-breakdown" id="scoreBreakdown"></div>
      <div class="cat-breakdown" id="catBreakdown"></div>
    </div>
    <div id="quizArea"></div>
    <div class="actions">
      <button id="submitBtn">&#x2705; Nộp bài</button>
      <button id="retryBtn">&#x1F504; Làm lại bộ này</button>
      <button id="newSetBtn">&#x1F3B2; Bộ đề mới</button>
      <button id="pdfBtn">&#x1F4C4; In / Xuất PDF</button>
    </div>
  </div>
</div>

<script>
var QUESTION_BANK = [];
var currentSet = [];
var submitted = false;

// === PASSWORD ===
const PASSWORD_PLAIN = "process2026";

function tryUnlock(){
  const val = document.getElementById('gatePassword').value;
  const errEl = document.getElementById('gateError');
  errEl.textContent = '';
  if(!val){ errEl.textContent = 'Vui lòng nhập mật khẩu.'; return; }
  if(val === PASSWORD_PLAIN){
    loadQuizData();
  } else {
    errEl.textContent = 'Mật khẩu không đúng. Vui lòng thử lại.';
    document.getElementById('gatePassword').value = '';
  }
}

document.getElementById('gateSubmit').addEventListener('click', tryUnlock);
document.getElementById('gatePassword').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') tryUnlock();
});

// === LOAD JSON ===
async function loadQuizData(){
  try {
    const resp = await fetch('process_safety_quiz_v2.json');
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw = await resp.text();
    // Strip BOM if present
    const clean = raw.charCodeAt(0) === 0xFEFF ? raw.slice(1) : raw;
    const data = JSON.parse(clean);

    // Flatten: documents → questions, inject category from document_name
    QUESTION_BANK = [];
    if(data.documents && Array.isArray(data.documents)){
      data.documents.forEach(doc => {
        const cat = doc.document_name || 'Unknown';
        if(doc.questions && Array.isArray(doc.questions)){
          doc.questions.forEach(q => {
            QUESTION_BANK.push({
              id: q.id,
              difficulty: q.difficulty,
              category: cat,
              question: q.question,
              options: q.options,
              answer: q.answer,
              explanation: q.explanation
            });
          });
        }
      });
    }

    if(QUESTION_BANK.length === 0) throw new Error('No questions found');

    document.getElementById('passGate').style.display = 'none';
    document.getElementById('quizContent').style.display = 'block';
    updateBankInfo();
    pickNewSet();
  } catch(err){
    document.getElementById('gateError').textContent =
      'Không thể tải file câu hỏi (process_safety_quiz_v2.json). Kiểm tra file đã được đặt cùng thư mục.';
    console.error('Load error:', err);
  }
}

// === BANK INFO ===
function updateBankInfo(){
  const easy = QUESTION_BANK.filter(q => q.difficulty === 'Easy').length;
  const med = QUESTION_BANK.filter(q => q.difficulty === 'Medium').length;
  const hard = QUESTION_BANK.filter(q => q.difficulty === 'Hard').length;
  const cats = [...new Set(QUESTION_BANK.map(q => q.category))];
  document.getElementById('bankInfo').innerHTML =
    '<span><b>Ngân hàng:</b> ' + QUESTION_BANK.length + ' câu</span>' +
    '<span><b>Easy:</b> ' + easy + '</span>' +
    '<span><b>Medium:</b> ' + med + '</span>' +
    '<span><b>Hard:</b> ' + hard + '</span>' +
    '<span><b>Tiêu chuẩn:</b> ' + cats.length + ' bộ</span>';
}

// === SHUFFLE ===
function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Shuffle options within a question
function shuffleQuestion(q){
  const letters = ['A','B','C','D'];
  const correctIdx = letters.indexOf(q.answer);
  const correctOpt = q.options[correctIdx];

  const indexed = q.options.map((opt, i) => ({opt, i}));
  const shuffled = shuffle([...indexed]);

  const newOptions = shuffled.map(s => s.opt);
  const newCorrectIdx = newOptions.indexOf(correctOpt);
  const newAnswer = letters[newCorrectIdx];

  return {...q, options: newOptions, answer: newAnswer};
}

// === PICK SET ===
function pickNewSet(){
  submitted = false;
  const mode = document.getElementById('modeSelect').value;
  let pool, count;

  if(mode === 'easy10'){
    pool = QUESTION_BANK.filter(q => q.difficulty === 'Easy');
    count = 10;
  } else if(mode === 'medium10'){
    pool = QUESTION_BANK.filter(q => q.difficulty === 'Medium');
    count = 10;
  } else if(mode === 'hard10'){
    pool = QUESTION_BANK.filter(q => q.difficulty === 'Hard');
    count = 10;
  } else if(mode === 'mix20'){
    pool = [...QUESTION_BANK];
    count = 20;
  } else if(mode === 'all'){
    pool = [...QUESTION_BANK];
    count = pool.length;
  } else {
    // mix10: 3 easy + 4 medium + 3 hard
    const easyQ = shuffle(QUESTION_BANK.filter(q => q.difficulty === 'Easy')).slice(0, 3);
    const medQ = shuffle(QUESTION_BANK.filter(q => q.difficulty === 'Medium')).slice(0, 4);
    const hardQ = shuffle(QUESTION_BANK.filter(q => q.difficulty === 'Hard')).slice(0, 3);
    currentSet = shuffle([...easyQ, ...medQ, ...hardQ]).map(q => shuffleQuestion(q));
    renderQuiz();
    return;
  }

  shuffle(pool);
  currentSet = pool.slice(0, Math.min(count, pool.length)).map(q => shuffleQuestion(q));
  renderQuiz();
}

// === HELPERS ===
function diffClass(d){
  if(d === 'Easy') return 'easy';
  if(d === 'Medium') return 'medium';
  return 'hard';
}
function diffLabel(d){
  if(d === 'Easy') return 'Dễ';
  if(d === 'Medium') return 'TB';
  return 'Khó';
}

// === RENDER ===
function renderQuiz(){
  const area = document.getElementById('quizArea');
  let html = '';
  currentSet.forEach((q, i) => {
    const letters = ['A','B','C','D'];
    html += '<div class="qcard" id="q' + i + '">';
    html += '<div class="qhead"><span class="qnum">Câu ' + (i+1) + '/' + currentSet.length + '</span>';
    html += '<div class="badges"><span class="badge ' + diffClass(q.difficulty) + '">' + diffLabel(q.difficulty) + '</span>';
    html += '<span class="badge cat">' + q.category + '</span></div></div>';
    html += '<div class="qtext">' + q.question + '</div>';
    html += '<div class="options">';
    q.options.forEach((opt, j) => {
      const letter = letters[j];
      const optText = opt.replace(/^[A-D]\.\s*/, '');
      html += '<label id="lbl_' + i + '_' + j + '"><input type="radio" name="q' + i + '" value="' + letter + '">';
      html += '<span class="opt-letter">' + letter + '.</span> <span>' + optText + '</span></label>';
    });
    html += '</div>';
    html += '<div class="explain" id="exp_' + i + '"><b>Giải thích:</b> ' + q.explanation + '</div>';
    html += '</div>';
  });
  area.innerHTML = html;

  // Click handlers
  currentSet.forEach((q, i) => {
    q.options.forEach((opt, j) => {
      const lbl = document.getElementById('lbl_' + i + '_' + j);
      lbl.addEventListener('click', function(){
        if(submitted) return;
        q.options.forEach((o, k) => {
          document.getElementById('lbl_' + i + '_' + k).classList.remove('selected');
        });
        lbl.classList.add('selected');
        updateProgress();
      });
    });
  });

  document.getElementById('scoreSummary').style.display = 'none';
  document.getElementById('submitBtn').style.display = '';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('newSetBtn').style.display = 'none';
  document.getElementById('pdfBtn').style.display = 'none';
  document.getElementById('progressFill').style.width = '0%';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function updateProgress(){
  let answered = 0;
  currentSet.forEach((q, i) => {
    const sel = document.querySelector('input[name="q' + i + '"]:checked');
    if(sel) answered++;
  });
  const pct = (answered / currentSet.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
}

// === SUBMIT ===
function submitQuiz(){
  if(submitted) return;
  let unanswered = 0;
  currentSet.forEach((q, i) => {
    const sel = document.querySelector('input[name="q' + i + '"]:checked');
    if(!sel) unanswered++;
  });
  if(unanswered > 0){
    if(!confirm('Bạn còn ' + unanswered + ' câu chưa trả lời. Nộp bài ngay?')) return;
  }
  submitted = true;

  let correct = 0;
  let byDiff = {Easy:{c:0,t:0}, Medium:{c:0,t:0}, Hard:{c:0,t:0}};
  let byCat = {};

  currentSet.forEach((q, i) => {
    const sel = document.querySelector('input[name="q' + i + '"]:checked');
    const answer = q.answer;
    const letters = ['A','B','C','D'];
    const correctIdx = letters.indexOf(answer);

    byDiff[q.difficulty].t++;
    if(!byCat[q.category]) byCat[q.category] = {c:0, t:0};
    byCat[q.category].t++;

    // Show correct
    document.getElementById('lbl_' + i + '_' + correctIdx).classList.add('correct-answer');

    if(sel && sel.value === answer){
      correct++;
      byDiff[q.difficulty].c++;
      byCat[q.category].c++;
      const parentLbl = sel.closest('label');
      parentLbl.innerHTML += '<span class="result-tag ok">✓ Đúng</span>';
    } else if(sel){
      const parentLbl = sel.closest('label');
      parentLbl.classList.add('wrong-answer');
      parentLbl.innerHTML += '<span class="result-tag no">✗ Sai</span>';
    }

    document.getElementById('exp_' + i).style.display = 'block';
    document.querySelectorAll('input[name="q' + i + '"]').forEach(r => r.disabled = true);
  });

  const pct = (correct / currentSet.length * 100).toFixed(0);
  document.getElementById('bigScore').textContent = correct + '/' + currentSet.length + ' (' + pct + '%)';
  document.getElementById('scoreSub').textContent = correct >= currentSet.length * 0.8 ? '🎉 Xuất sắc!' :
    correct >= currentSet.length * 0.6 ? '👍 Khá tốt, cần ôn thêm.' : '📖 Cần ôn tập lại kiến thức.';

  let bdHtml = '';
  ['Easy','Medium','Hard'].forEach(d => {
    if(byDiff[d].t > 0){
      bdHtml += '<div><b>' + byDiff[d].c + '/' + byDiff[d].t + '</b>' + diffLabel(d) + '</div>';
    }
  });
  document.getElementById('scoreBreakdown').innerHTML = bdHtml;

  // Category breakdown bars
  let catHtml = '';
  Object.keys(byCat).sort().forEach(cat => {
    const c = byCat[cat];
    const p = Math.round((c.c / c.t) * 100);
    const color = p >= 70 ? 'var(--green)' : p >= 45 ? 'var(--amber)' : 'var(--red)';
    catHtml += '<div class="cat-bar-row">' +
      '<span class="cat-bar-label">' + cat + '</span>' +
      '<div class="cat-bar-bg"><div class="cat-bar-fill" style="width:' + p + '%;background:' + color + '"></div></div>' +
      '<span class="cat-bar-pct" style="color:' + color + '">' + c.c + '/' + c.t + ' (' + p + '%)</span>' +
      '</div>';
  });
  document.getElementById('catBreakdown').innerHTML = catHtml;

  document.getElementById('scoreSummary').style.display = 'block';
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('retryBtn').style.display = '';
  document.getElementById('newSetBtn').style.display = '';
  document.getElementById('pdfBtn').style.display = '';
  document.getElementById('progressFill').style.width = '100%';

  window.scrollTo({top: 0, behavior: 'smooth'});
}

// === RETRY ===
function retryQuiz(){
  submitted = false;
  currentSet.forEach((q, i) => {
    q.options.forEach((o, j) => {
      const lbl = document.getElementById('lbl_' + i + '_' + j);
      lbl.classList.remove('selected','correct-answer','wrong-answer');
      const tag = lbl.querySelector('.result-tag');
      if(tag) tag.remove();
    });
    document.querySelectorAll('input[name="q' + i + '"]').forEach(r => { r.disabled = false; r.checked = false; });
    document.getElementById('exp_' + i).style.display = 'none';
  });
  document.getElementById('scoreSummary').style.display = 'none';
  document.getElementById('submitBtn').style.display = '';
  document.getElementById('retryBtn').style.display = 'none';
  document.getElementById('newSetBtn').style.display = 'none';
  document.getElementById('pdfBtn').style.display = 'none';
  document.getElementById('progressFill').style.width = '0%';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// === EVENT LISTENERS ===
document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('retryBtn').addEventListener('click', retryQuiz);
document.getElementById('newSetBtn').addEventListener('click', pickNewSet);
document.getElementById('newSetBtn2').addEventListener('click', pickNewSet);
document.getElementById('modeSelect').addEventListener('change', pickNewSet);
document.getElementById('pdfBtn').addEventListener('click', () => window.print());

// Anti-copy
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
  const k = e.key;
  const blocked = (k === 'F12') ||
    (e.ctrlKey && e.shiftKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j' || k === 'C' || k === 'c')) ||
    (e.ctrlKey && (k === 'U' || k === 'u'));
  if(blocked) e.preventDefault();
});
</script>
</body>
